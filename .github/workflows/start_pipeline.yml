name: Start Pipeline

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_head:
        description: 'PR Head ([<owner>:]<branch>)'

jobs:
  start_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Requirements
        run: |
          python -m pip install requests
      - name: Checkout and Start Pipeline
        env:
          STARTER_MODELS_PIPELINE_TOKEN: ${{ secrets.STARTER_MODELS_PIPELINE_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            OWNER="${{ github.event.pull_request.head.user.login }}"
            BRANCH="${{ github.event.pull_request.head.ref }}"
            IS_PR="--is-pr"
            git clone https://github.com/${{ github.repository }}.git deepcraft-studio-accelerators
            cd deepcraft-studio-accelerators
            git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
            git checkout pr-${{ github.event.pull_request.number }}
          else
            PR_HEAD="${{ github.event.inputs.pr_head }}"
            if [ -n "$PR_HEAD" ]; then
              OWNER=$(echo $PR_HEAD | cut -d':' -f1)
              BRANCH=$(echo $PR_HEAD | cut -d':' -f2)
              IS_PR="--is-pr"
            else
              OWNER="${{ github.repository_owner }}"
              BRANCH="${{ github.ref_name }}"
              IS_PR=""
            fi
            git clone --branch $BRANCH https://github.com/$OWNER/${{ github.event.repository.name }}.git deepcraft-studio-accelerators
            cd deepcraft-studio-accelerators
          fi
          
          # Start the pipeline
          python .github/workflows/start_pipeline.py --owner "$OWNER" --branch "$BRANCH" $IS_PR
