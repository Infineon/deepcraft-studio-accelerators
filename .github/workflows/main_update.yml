name: main - Update Projects
run-name: >
  ${{
    github.event.action == 'main_update_all' && 'All Projects' ||
    github.event.action == 'main_update_post' && github.event.client_payload.rel_path ||
    ''
  }}

permissions:
  id-token: write
  contents: write

on:
  repository_dispatch:
    types:
      - main_update_all
      - main_update_post
  push:
    branches:
      - main
    paths-ignore:
      - Models/**

jobs:
  deploy:
    runs-on: windows-2025
    steps:
      - name: Install Pipeline Package
        shell: pwsh
        env:
          STARTER_PROJECTS_PIPELINE_DEPLOY_KEY: ${{ secrets.STARTER_PROJECTS_PIPELINE_DEPLOY_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'starter-projects-pipeline-deploy'
          $keyText = $env:STARTER_PROJECTS_PIPELINE_DEPLOY_KEY.Replace('\n', "`n").Replace("`r`n", "`n").Replace("`r", "`n")
          if (-not $keyText.EndsWith("`n")) { $keyText += "`n" }
          [System.IO.File]::WriteAllText($keyPath, $keyText)
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "${env:USERNAME}:(R)" | Out-Null
          $env:GIT_SSH_COMMAND = "ssh -i `"$keyPath`" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          "GIT_SSH_COMMAND=$($env:GIT_SSH_COMMAND)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          git clone git@github.com:Infineon/starter-projects-pipeline.git
          pip install -e starter-projects-pipeline

      - name: Update projects
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENSOR_MAP: ${{ vars.SENSOR_MAP }}
          STARTER_PROJECTS_PIPELINE_DEPLOY_KEY: ${{ secrets.STARTER_PROJECTS_PIPELINE_DEPLOY_KEY }}
        run: |
          if ("${{ github.event.action }}" -eq "main_update_all") {
            $args = @()
            if ('${{ toJson(github.event.client_payload) }}' -ne 'null') { $args += "--version", "${{ github.event.client_payload.version }}", "--commit", "${{ github.event.client_payload.commit }}" }
            dcp update-all @args
          } elseif ("${{ github.event.action }}" -eq "main_update_post") {
            dcp update-trained --project '${{ toJson(github.event.client_payload) }}'
          } elseif ("${{ github.event_name }}" -eq "push") {
            dcp update-changes --commit '${{ github.sha }}'
          } else {
            throw "Unsupported event: ${{ github.event_name }}"
          }
